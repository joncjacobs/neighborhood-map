<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <!-- Only these hosts may run code, load images or receive data from this page. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' https://unpkg.com; img-src 'self' data: blob: https://unpkg.com https://server.arcgisonline.com https://*.basemaps.cartocdn.com https://beutvmwgvkggrndjklcq.supabase.co; connect-src https://beutvmwgvkggrndjklcq.supabase.co wss://beutvmwgvkggrndjklcq.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#1f2937">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Neighbors">
  <title>Neighborhood Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <h1>Neighborhood Map</h1>
    <div class="controls">
      <button id="namesBtn" class="toggle" aria-pressed="false">Show names</button>
      <button id="baseBtn" class="toggle" aria-pressed="false">Street map</button>
      <button id="listBtn" class="toggle" aria-pressed="false" aria-controls="panel">List</button>
      <button id="menuBtn" class="toggle icon-btn" aria-haspopup="true" aria-expanded="false" aria-label="More">&#8943;</button>
      <div id="menu" class="menu" hidden>
        <button id="exportBtn">Export data</button>
        <button id="signOutBtn">Sign out</button>
      </div>
    </div>
  </header>

  <main>
    <div id="map" aria-label="Map of houses"></div>
    <div id="status" class="status" hidden></div>

    <aside id="panel" class="panel" hidden>
      <div class="panel-head">
        <input id="search" type="search" placeholder="Search names, notes, addresses" autocomplete="off" aria-label="Search">
        <button id="closePanel" class="icon" aria-label="Close list">&times;</button>
      </div>
      <div id="list" class="list"></div>
    </aside>

    <aside id="detail" class="panel" hidden aria-live="polite"></aside>
  </main>

  <div id="login" class="login" hidden>
    <form id="loginForm" class="login-card">
      <h2>Neighborhood Map</h2>
      <p class="muted">Sign in to see names and notes.</p>
      <label>Email <input id="email" type="email" autocomplete="username" required></label>
      <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
      <button type="submit" class="primary">Sign in</button>
      <p id="loginError" class="error" role="alert" hidden></p>
    </form>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"
          integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
